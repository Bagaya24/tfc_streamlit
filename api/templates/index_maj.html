<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Supermarché</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style_maj.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-store"></i> Gestion de Supermarché</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-3">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
                    <i class="fas fa-plus"></i> Ajouter un Produit
                </button>
            </div>
            <div class="col-md-9">
                <div class="row">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="Rechercher un produit...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterCategorie">
                            <option value="">Toutes les catégories</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterMarque">
                            <option value="">Toutes les marques</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterFournisseur">
                            <option value="">Tous les fournisseurs</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="productsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Description</th>
                                <th>Prix</th>
                                <th>Stock</th>
                                <th>Catégorie</th>
                                <th>Marque</th>
                                <th>Fournisseur</th>
                                <th>Date d'expiration</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Les produits seront ajoutés ici dynamiquement -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pour Ajouter/Modifier un Produit -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajouter un Produit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="prix" class="form-label">Prix</label>
                            <input type="number" class="form-control" id="prix" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="quantite" class="form-label">Quantité en Stock</label>
                            <input type="number" class="form-control" id="quantite" required>
                        </div>
                        <div class="mb-3">
                            <label for="categorie" class="form-label">Catégorie</label>
                            <select class="form-select" id="categorie">
                                <option value="">Sélectionner une catégorie</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="marque" class="form-label">Marque</label>
                            <select class="form-select" id="marque">
                                <option value="">Sélectionner une marque</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="fournisseur" class="form-label">Fournisseur</label>
                            <select class="form-select" id="fournisseur">
                                <option value="">Sélectionner un fournisseur</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="dateExpiration" class="form-label">Date d'expiration</label>
                            <input type="date" class="form-control" id="dateExpiration">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="saveProduct">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast pour les notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/main_maj.js"></script>
</body>
</html>
