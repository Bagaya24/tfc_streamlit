<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande Confirmée</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body>

    <div class="container">
         <button id="annuler-btn" class="annuler">Annuler</button>

        <h1>Votre commande</h1>
        <table>
            <tr>
                <th>Produit</th>
                <th>Quantité</th>
                <th>Total ($)</th>
            </tr>
            {% for i in range(nombre_produit) %}
            <tr>
                <td>{{ noms[i] }}</td>
                <td>{{ quantite[i] }}</td>
                <td>{{ prix_quantite[i] }} $</td>
            </tr>
            {% endfor %}
        </table>
        <h2>Total à payer : {{ prix_total }} $</h2>
        <button id="paiement-btn" class="paiement">Effectuer le paiement</button>
        <p id="paiement-message" style="display: none; color: green; font-weight: bold;">✅ Paiement effectué avec succès!</p>

        <button id="retour-chat" class="annuler" style="display: none;">Retourner au chat ?</button>


    </div>
</body>
</html>
